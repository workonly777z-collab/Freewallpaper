<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreeWallpapers Galaxy</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        
        .auth-container {
            max-width: 28rem;
        }
    </style>
</head>
<body class="gradient-bg">
    <!-- Navbar -->
    <nav class="bg-slate-800/50 backdrop-blur-md sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i data-feather="image" class="text-amber-400 h-8 w-8 mr-2"></i>
                        <span class="text-xl font-bold text-white">FreeWallpapers Galaxy</span>
                    </div>
                </div>
                <div class="hidden md:ml-6 md:flex md:items-center md:space-x-4">
                    <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="#" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Premium</a>
                    <a href="signup.html" class="text-amber-400 hover:text-amber-300 px-3 py-2 rounded-md text-sm font-medium">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="auth-container bg-slate-800 rounded-xl shadow-lg overflow-hidden">
            <div class="p-8 sm:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
                    <p class="text-gray-400 mt-2">Login to access your premium wallpapers</p>
                </div>
                
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-white mb-1">Email Address</label>
                        <input type="email" id="email" class="w-full bg-slate-700 border border-slate-600 rounded-md px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-white mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" class="w-full bg-slate-700 border border-slate-600 rounded-md px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                            <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-white" onclick="togglePassword('password')">
                                <i data-feather="eye" id="passwordEye" class="h-5 w-5"></i>
                            </button>
                        </div>
                        <div class="flex justify-end mt-1">
                            <a href="#" class="text-xs text-amber-400 hover:text-amber-300">Forgot password?</a>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember" name="remember" type="checkbox" class="h-4 w-4 text-amber-600 focus:ring-amber-500 border-slate-600 rounded bg-slate-700">
                            <label for="remember" class="ml-2 block text-sm text-white">Remember me</label>
                        </div>
                    </div>
                    
                    <div>
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                            Sign In
                        </button>
                    </div>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-400">
                        Don't have an account?
                        <a href="signup.html" class="font-medium text-amber-400 hover:text-amber-300">Sign up</a>
                    </p>
                </div>
                
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-600"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-slate-800 text-gray-400">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <div>
                            <button type="button" class="w-full inline-flex justify-center py-2 px-4 border border-slate-600 rounded-md shadow-sm bg-slate-700 text-sm font-medium text-white hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                                <i data-feather="github" class="h-5 w-5"></i>
                            </button>
                        </div>
                        <div>
                            <button type="button" class="w-full inline-flex justify-center py-2 px-4 border border-slate-600 rounded-md shadow-sm bg-slate-700 text-sm font-medium text-white hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                                <i data-feather="twitter" class="h-5 w-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();

            function togglePassword(fieldId) {
                const field = document.getElementById(fieldId);
                const eyeIcon = document.getElementById(fieldId + 'Eye');
                
                if (field.type === 'password') {
                    field.type = 'text';
                    eyeIcon.setAttribute('data-feather', 'eye-off');
                } else {
                    field.type = 'password';
                    eyeIcon.setAttribute('data-feather', 'eye');
                }
                feather.replace();
            }

            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Simulate login
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (email && password) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    alert('Login successful! Redirecting to premium content...');
                    window.location.href = 'premium.html';
                } else {
                    alert('Please enter both email and password');
                }
            });
        });
    </script>
</body>
</html>
